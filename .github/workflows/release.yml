# Release flow: push a tag → verify → publish to npm → create a GitHub release.
#
#   git tag v0.1.1 && git push origin v0.1.1
#
# Publishes via npm trusted publishing (OIDC): no NPM_TOKEN secret needed.
# Requires a one-time "Trusted Publisher" config on npmjs.com for this package
# pointing at this workflow file. Provenance is included automatically:
# package.json#repository matches this remote and id-token: write is granted.
# Node 24 is required: the OIDC token exchange needs npm >= 11.5.

name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: build · publish npm · github release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm provenance / trusted publishing
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # reads the version from package.json#packageManager
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # ships npm >= 11.5, required for OIDC trusted publishing
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      - name: Verify (lint · typecheck · test)
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Build
        run: pnpm build

      - name: Publish to npm
        run: pnpm publish --access public --no-git-checks --provenance

      - name: Pack release artifact
        run: npm pack

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: agents-aliases-*.tgz
          generate_release_notes: true
