# Release flow: push a tag → verify → publish to npm → create a GitHub release.
#
#   git tag v0.1.1 && git push origin v0.1.1
#
# Required secret: NPM_TOKEN (an npm automation/granular token).
#
# npm provenance note: once this repository has its public GitHub remote,
# add a matching "repository" field to package.json and append
# `--provenance` to the pnpm publish step below — the id-token permission
# is already granted.

name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: build · publish npm · github release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm provenance / trusted publishing
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4 # reads the version from package.json#packageManager
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      - name: Verify (lint · typecheck · test)
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Build
        run: pnpm build

      - name: Publish to npm
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Pack release artifact
        run: npm pack

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: agents-aliases-*.tgz
          generate_release_notes: true
